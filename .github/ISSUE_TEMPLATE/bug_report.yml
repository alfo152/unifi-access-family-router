name: Bug report
description: Something does not work as documented.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Remove API tokens, passwords and public IP addresses** from everything you paste.
  - type: input
    id: version
    attributes:
      label: Router version
      placeholder: "0.1.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run the router?
      options:
        - Home Assistant add-on
        - Docker stack
        - Command line (pip)
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: logs
    attributes:
      label: Router log
      render: text
  - type: textarea
    id: config
    attributes:
      label: Configuration (without token and passwords)
      render: yaml
