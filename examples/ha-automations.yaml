# EN: phone notification when THIS family is called, with an "Apri" (open)
#     action that asks for Face ID / passcode. Requires the Home Assistant
#     Companion app. Replace the entity IDs and the notify service with yours.
#     With the HomeKit Bridge package (docs/homekit-bridge.md) Apple Home
#     already notifies: use this automation only if you also want the
#     Companion app notification.
# IT: notifica sul telefono quando chiamano QUESTA famiglia, con il tasto
#     "Apri" che chiede Face ID / codice. Serve l'app Companion di Home
#     Assistant. Sostituisci gli ID e il servizio notify con i tuoi.
#     Con il pacchetto HomeKit Bridge (docs/it/homekit-bridge.md) Apple Casa
#     notifica già: usa questa automazione solo se vuoi anche la notifica
#     dell'app Companion.
- alias: Citofono - chiamata per la famiglia
  mode: single
  triggers:
    - trigger: state
      entity_id: event.intercom_famiglia_rossi_doorbell
  conditions:
    # EN: ignore restarts (unavailable -> restored state)
    # IT: ignora i riavvii (non disponibile -> stato ripristinato)
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none
           and trigger.from_state.state not in ['unavailable', 'unknown']
           and trigger.to_state.attributes.event_type == 'ring' }}
  actions:
    - action: notify.mobile_app_iphone
      data:
        title: Citofono
        message: Suonano al portone
        data:
          entity_id: camera.g3_intercom_high
          push:
            interruption-level: time-sensitive
          actions:
            - action: APRI_PORTONE
              title: Apri
              destructive: true
              authenticationRequired: true
    - wait_for_trigger:
        - trigger: event
          event_type: mobile_app_notification_action
          event_data:
            action: APRI_PORTONE
      timeout: "00:01:00"
      continue_on_timeout: false
    - action: button.press
      target:
        entity_id: button.intercom_famiglia_rossi_unlock_portone
