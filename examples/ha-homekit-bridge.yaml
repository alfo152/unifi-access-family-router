# configuration.yaml - option B for Apple Home (see docs/homekit.md).
# Exposes the G3 camera to THIS family's Apple Home as a video doorbell that
# rings only when this family is called (the router's Doorbell event entity).
# The HomeKit Bridge does not support talking back: talk from the
# homebridge-unifi-protect tile.
homekit:
  - name: Citofono Famiglia Rossi
    port: 21070
    mode: accessory
    filter:
      include_entities:
        - camera.g3_intercom_high
    entity_config:
      camera.g3_intercom_high:
        name: Citofono
        linked_doorbell_sensor: event.intercom_famiglia_rossi_doorbell
        support_audio: true
