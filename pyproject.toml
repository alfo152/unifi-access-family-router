[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unifi-access-family-router"
version = "0.2.0"
description = "Ring only the called family on a UniFi Access intercom (Apple Home via Homebridge, Home Assistant via MQTT)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]

[project.scripts]
family-router = "family_router.__main__:main"

[tool.setuptools.packages.find]
where = ["family_router/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "family_router/app"
ignore_missing_imports = true
