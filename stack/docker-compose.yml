# Per-family stack: MQTT broker + router + Homebridge.
# Run ONE copy of this folder per family, on that family's own computer
# (mini PC, NAS, Raspberry Pi...). Nothing is shared between families.
#
#   cp router/config.yaml.example router/config.yaml   # then edit it
#   docker compose run --rm mosquitto mosquitto_passwd -c -b /mosquitto/config/passwd router  ROUTER_PASSWORD
#   docker compose run --rm mosquitto mosquitto_passwd    -b /mosquitto/config/passwd homebridge HOMEBRIDGE_PASSWORD
#   docker compose run --rm mosquitto mosquitto_passwd    -b /mosquitto/config/passwd homeassistant HA_PASSWORD
#   docker compose up -d --build

name: intercom-family

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # Home Assistant and Homebridge connect here. Bind to the family LAN IP
      # (e.g. "192.168.60.10:1883:1883") instead of all interfaces if you can.
      - "1883:1883"
    volumes:
      - ./mosquitto:/mosquitto/config
      - mosquitto-data:/mosquitto/data

  router:
    build:
      context: ..
    image: unifi-access-family-router:local
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - ./router/config.yaml:/config/config.yaml:ro

  homebridge:
    image: homebridge/homebridge:latest
    restart: unless-stopped
    # HomeKit needs multicast DNS: host networking is required.
    network_mode: host
    volumes:
      - ./homebridge:/homebridge

volumes:
  mosquitto-data:
