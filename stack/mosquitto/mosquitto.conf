# EN: Mosquitto broker of ONE family. Anonymous access is disabled: the unlock
#     command travels over this broker, so every client needs a password.
# IT: broker Mosquitto di UNA famiglia. Accesso anonimo disattivato: il
#     comando di apertura passa da qui, quindi ogni client ha una password.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
